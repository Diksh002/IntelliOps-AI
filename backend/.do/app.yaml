name: datascout-backend
region: nyc

services:
  - name: api
    github:
      repo: MBilalKhanAI/DataScout-backend
      branch: main
      deploy_on_push: true
    
    dockerfile_path: Dockerfile
    
    http_port: 8000
    
    instance_count: 1
    instance_size_slug: basic-xxs
    
    health_check:
      http_path: /
    
    envs:
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      
      - key: PINECONE_API_KEY
        scope: RUN_TIME
        type: SECRET
      
      - key: PINECONE_INDEX_NAME
        scope: RUN_TIME
        value: datascout
      
      - key: PINECONE_HOST
        scope: RUN_TIME
        type: SECRET
      
      - key: LANGCHAIN_TRACING_V2
        scope: RUN_TIME
        value: "false"
